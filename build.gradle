plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'elekter'
version = '0.0.1'

// Build with whatever JDK runs Gradle, but target Java 17 so the jar runs on
// Raspberry Pi OS (Bookworm ships OpenJDK 17; the Pi runs OpenJDK 21 where available).
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
